services:
  - type: web
    name: fs-spotter-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/v1/routes/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: fs-spotter-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://fs-spotter.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://fs-spotter.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fs-spotter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fs-spotter-cache
          type: keyvalue
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: ROUTING_PROVIDER
        value: ors
      - key: WEATHER_PROVIDER
        value: open_meteo
      - key: PROVIDER_HTTP_TIMEOUT
        value: "90"

  - type: worker
    name: fs-spotter-worker
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A core worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        fromService:
          name: fs-spotter-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: fs-spotter-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fs-spotter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fs-spotter-cache
          type: keyvalue
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: ROUTING_PROVIDER
        value: ors
      - key: WEATHER_PROVIDER
        value: open_meteo
      - key: PROVIDER_HTTP_TIMEOUT
        value: "90"

  - type: web
    name: fs-spotter
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: fs-spotter-api
          type: web
          property: host
      - key: VITE_MAPTILER_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: fs-spotter-cache
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: fs-spotter-db
    plan: free
    region: oregon
    databaseName: fs_spotter
    user: fs_spotter
    postgresMajorVersion: "16"
    ipAllowList: []
